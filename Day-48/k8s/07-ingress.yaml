apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-k8s-ingress
  namespace: go-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: go-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-k8s-service
                port:
                  number: 8080
