apiVersion: v1
kind: Service
metadata:
  name: go-api-clusterip
  namespace: default
  labels:
    app: go-api
spec:
  type: ClusterIP
  selector:
    app: go-api
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: go-api-nodeport
  namespace: default
  labels:
    app: go-api
spec:
  type: NodePort
  selector:
    app: go-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
